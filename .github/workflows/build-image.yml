# Builds and pushes the multi-arch workshop sample-app image to Docker Hub.
#
# Operator pre-requisite (the workflow cannot create these):
#   Repo Actions secrets must exist before this workflow can push:
#     - DOCKERHUB_USERNAME : a Docker Hub username with push rights
#     - DOCKERHUB_TOKEN    : a Docker Hub access token scoped to PUSH on
#                            altf4llc/fem-kubernetes
#
# Every `uses:` is digest-pinned to a commit SHA (a moving tag is reject-class
# for this workflow); the trailing `# vX.Y.Z` records the human-readable
# version each SHA resolves to.
name: build-image

on:
  push:
    branches:
      - main
      - workshop
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up QEMU
        uses: docker/setup-qemu-action@06116385d9baf250c9f4dcb4858b16962ea869c3 # v4.1.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Log in to Docker Hub
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: app/
          file: app/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            docker.io/altf4llc/fem-kubernetes:v1
            docker.io/altf4llc/fem-kubernetes:${{ github.sha }}
